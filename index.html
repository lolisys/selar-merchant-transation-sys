<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selar Merchant Payment Interface</title>
    <style>
        :root {
            --selar-purple: #5a1a5a;
            --success-green: #28a745;
            --error-red: #d9534f;
            --airtel-red: #ff0000;
            --mtn-yellow: #ffcc00;
            --bg-gray: #f0f2f5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-gray);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .checkout-wrapper {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 24px;
            text-align: center;
            position: relative;
        }

        /* Header Elements */
        .status-header {
            display: inline-flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 50px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .status-dot { color: var(--success-green); margin-right: 6px; }

        .brand-logo {
            background-color: var(--selar-purple);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            margin: 0 auto 10px;
        }

        .merchant-title { font-size: 16px; font-weight: 800; margin: 8px 0; }
        .verified-text { color: var(--success-green); font-size: 13px; margin-bottom: 20px; }

        /* Receipt Card */
        .receipt-card {
            background-color: #fcfcfc;
            border: 1px dashed #ccc;
            padding: 15px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .error-box {
            border: 1px solid var(--error-red);
            color: var(--error-red);
            padding: 8px;
            font-size: 10px;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        /* Form Styling */
        .payment-box {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
        }

        .flex-input { display: flex; gap: 8px; margin-bottom: 12px; }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn-submit {
            background-color: #00a651;
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* LOADING OVERLAY */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--selar-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* FINAL INSTRUCTION MODAL */
        #instructionModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 380px;
            border-radius: 20px;
            overflow: hidden;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header {
            background: linear-gradient(135deg, var(--selar-purple), #801880);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .airtel-badge {
            background: white;
            color: var(--airtel-red);
            display: inline-flex;
            align-items: center;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 800;
            margin-top: 10px;
            font-size: 14px;
        }

        .flag-blink { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .modal-body { padding: 20px; text-align: left; }
        .step { display: flex; align-items: center; margin-bottom: 15px; font-size: 14px; color: #333; }
        .icon-circle {
            width: 35px; height: 35px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
        }

        .highlight-box {
            background: #fff9c4;
            border-left: 4px solid #fbc02d;
            padding: 10px;
            font-weight: bold;
            margin: 10px 0;
            font-family: monospace;
        }

        .btn-close {
            width: 100%;
            padding: 15px;
            border: none;
            background: #00a651;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-close:hover { background: #008c44; }

    </style>
</head>
