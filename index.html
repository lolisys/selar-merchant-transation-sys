    <style>
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .flag-blink { animation: blink 1s infinite; font-size: 18px; }
        #verifying-text { font-size: 13px; color: #166534; font-weight: bold; }
    </style>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const mobileNumber = document.getElementById('mobile').value;
            const btn = document.getElementById('submitBtn');
            const notice = document.getElementById('processing-notice');
            
            // UI Update
            btn.disabled = true;
            btn.innerText = "Processing...";
            notice.style.display = "block";
            
            // Set the dynamic verification text
            notice.innerHTML = `
                <div id="verifying-text">
                    <span class="loading-spinner"></span> 
                    Verifying Sim card (${mobileNumber}) for merchant transaction of 200$~743,000UGX
                </div>
            `;

            // 7 Second Delay
            setTimeout(() => {
                document.getElementById('payment-modal').style.display = 'flex';
                // Reset form state
                btn.disabled = false;
                btn.innerText = "Continue";
                notice.style.display = "none";
            }, 7000);
        });

        function closeModal() {
            document.getElementById('payment-modal').style.display = 'none';
        }
    </script>
